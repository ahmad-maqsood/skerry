name: Release

# One button: Actions > Release > Run workflow. Nothing to do on your own computer.
#   version:          type the new version (1.4.0, or patch / minor / major). The workflow updates
#                     package.json, Cargo.toml, Cargo.lock and tauri.conf.json for you and, when
#                     publishing, commits "Bump version to X" to the branch it runs on before building.
#                     Leave it empty to release the version already in the files.
#   publish unticked: a quick trial. Builds and signs only the NSIS installer and attaches it to the
#                     run as a download. No MSI and no update manifest, so it cannot be published.
#   publish ticked:   the full release: runs the frontend checks, builds and signs both the NSIS and
#                     MSI installers, then publishes a GitHub release that in-app updates pick up.
#                     The release description is written for you (scripts/release/release-notes.mjs):
#                     what changed since the last release, the installers with their checksums, and
#                     a changelog link. Put your own text in docs/releases/vX.Y.Z.md to replace the
#                     "What's new" part.
# Clippy and the Rust tests are not repeated here: CI runs them on every push to main.
# The version comes from package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json
# (they must match). The "version" input above sets all of them; pnpm bump does the same locally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version: 1.4.0, or patch / minor / major (empty = keep the current version)"
        type: string
        required: false
        default: ""
      publish:
        description: "Publish a GitHub release (leave unticked to only build)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      # Full history and tags: the release description lists the commits since the last release.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the signing secrets exist
        shell: bash
        run: |
          MISSING=()
          [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && MISSING+=("TAURI_SIGNING_PRIVATE_KEY")
          [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ] && MISSING+=("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          [ -z "${TAURI_UPDATER_PUBKEY:-}" ] && MISSING+=("TAURI_UPDATER_PUBKEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            for secret in "${MISSING[@]}"; do echo "::error::Missing secret: $secret"; done
            echo "::error::Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Rewrites the four version files in this run's checkout. Typing the current version is fine
      # (it lets you start again after a failed run). A typo fails here, before anything is built.
      - name: Set the version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release/bump-version.mjs "$REQUESTED_VERSION" --allow-same

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Same version as rust-toolchain.toml; change both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugins
          shared-key: skerry-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only a release people will install is worth 30 seconds of checking again.
      - name: Check the frontend
        if: ${{ inputs.publish }}
        run: pnpm check

      # The release is created at this commit, so the bump has to be on GitHub before the build. It is
      # pushed only after the checks pass, so a broken build leaves no stray commit behind.
      - name: Commit the new version
        if: ${{ inputs.publish && inputs.version != '' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The version files already match; nothing to commit."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Bump version to ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build, sign and publish
        if: ${{ inputs.publish }}
        shell: bash
        run: node scripts/release/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and sign a trial installer
        if: ${{ !inputs.publish }}
        shell: bash
        run: node scripts/release/release.mjs --no-upload --nsis-only

      - name: Attach the installer to this run
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: skerry-installers
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
