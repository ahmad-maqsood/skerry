name: Release

# One button: Actions > Release > Run workflow.
#   publish unticked: builds and signs the installers, then attaches them to the run as a download.
#   publish ticked:   does the same, then publishes a GitHub release that in-app updates pick up.
# The version comes from package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json
# (they must match). Change it with: node scripts/release/bump-version.mjs patch

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (leave unticked to only build)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets exist
        shell: bash
        run: |
          MISSING=()
          [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && MISSING+=("TAURI_SIGNING_PRIVATE_KEY")
          [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ] && MISSING+=("TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          [ -z "${TAURI_UPDATER_PUBKEY:-}" ] && MISSING+=("TAURI_UPDATER_PUBKEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            for secret in "${MISSING[@]}"; do echo "::error::Missing secret: $secret"; done
            echo "::error::Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Same version as rust-toolchain.toml; change both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugins
          shared-key: skerry-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-check frontend
        run: pnpm check

      - name: Pre-check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build, sign and publish
        if: ${{ inputs.publish }}
        shell: bash
        run: node scripts/release/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and sign only
        if: ${{ !inputs.publish }}
        shell: bash
        run: node scripts/release/release.mjs --no-upload

      - name: Attach the installers to this run
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: skerry-installers
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/msi/*.msi
