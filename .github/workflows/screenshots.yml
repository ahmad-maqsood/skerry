name: Refresh native app screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: native-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture screenshots from Skerry
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture screenshots from the native Tauri app
        run: pnpm screenshots
      - name: Upload screenshot preview
        uses: actions/upload-artifact@v4
        with:
          name: skerry-native-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Open or update screenshot pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-native-screenshots
          delete-branch: true
          commit-message: 'docs: refresh native application screenshots'
          title: 'docs: refresh native application screenshots'
          body: |
            ## Summary
            - Capture the production Skerry React UI inside the actual Tauri desktop window on a Windows runner.
            - Use isolated fictional demo data and mocked OS-facing commands; no personal desktop data is captured.
            - Refresh the individual README images and theme comparison.

            Generated by the **Refresh native app screenshots** workflow.
          add-paths: docs/assets/screenshots/*.png
