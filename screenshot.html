<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skerry screenshot capture</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; background: #0f172a; }
      html[data-wallpaper] body {
        background: radial-gradient(60% 70% at 18% 30%, #7c3aed 0%, transparent 70%),
          radial-gradient(55% 65% at 82% 22%, #0ea5e9 0%, transparent 70%),
          radial-gradient(60% 60% at 55% 95%, #f43f5e 0%, transparent 70%), #0f172a;
      }
      html[data-scene="clipboard"] #root { width: 420px; height: 640px; margin: 80px auto 0; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
      html[data-scene="settings"] #root { width: 800px; height: 660px; margin: 70px auto 0; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/tests/screenshots/scene.tsx"></script></body>
</html>
