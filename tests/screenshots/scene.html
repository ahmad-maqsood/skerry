<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skerry screenshot scene</title>
    <style>
      /* The clean, dark desktop the shot list asks for: no icons, no windows. */
      html body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #0f172a;
      }
      /* ?wallpaper=1 puts colour behind the island so the glass materials have something to blur. */
      html[data-wallpaper] body {
        background:
          radial-gradient(60% 70% at 18% 30%, #7c3aed 0%, transparent 70%),
          radial-gradient(55% 65% at 82% 22%, #0ea5e9 0%, transparent 70%),
          radial-gradient(60% 60% at 55% 95%, #f43f5e 0%, transparent 70%),
          #0f172a;
      }
      /* The standalone windows float on the desktop at their real size (tauri.conf.json). */
      html[data-scene="clipboard"] #root { width: 420px; height: 640px; margin: 80px auto 0; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
      html[data-scene="settings"] #root { width: 800px; height: 660px; margin: 70px auto 0; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Report page startup failures even when the screenshot module cannot finish loading.
      (() => {
        const params = new URLSearchParams(location.search);
        const port = params.get("capturePort");
        const token = params.get("captureToken");
        if (!port || !token) return;
        const report = (message) => {
          const url = new URL(`http://127.0.0.1:${port}/scene-signal`);
          url.searchParams.set("token", token);
          url.searchParams.set("status", "error");
          url.searchParams.set("message", String(message).slice(0, 500));
          fetch(url, { method: "GET", mode: "cors", cache: "no-store" }).catch((error) => {
            console.error("Could not report screenshot startup failure:", error);
          });
        };
        window.addEventListener("error", (event) => {
          const target = event.target;
          const detail = target && target !== window && "src" in target
            ? `Failed to load script/resource: ${target.src}`
            : event.message || "Unknown JavaScript startup error";
          report(detail);
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          report(`Unhandled promise rejection: ${event.reason?.stack || event.reason}`);
        });
      })();
    </script>
    <script type="module" src="./scene.tsx"></script>
  </body>
</html>
